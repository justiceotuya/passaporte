name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Schema validate content
        run: pnpm content:validate
      - name: Ship gate
        run: pnpm content:ship-gate
      - name: Web unit tests
        run: pnpm web:test
      - name: Pipeline pytest
        run: pnpm pipeline:test
