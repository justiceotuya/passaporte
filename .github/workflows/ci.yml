name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Schema validate content
        run: pnpm content:validate
      - name: Ship gate
        run: pnpm content:ship-gate
      - name: Web unit tests
        run: pnpm web:test
      - name: Pipeline pytest
        run: |
          cd pipeline
          if command -v uv >/dev/null 2>&1; then
            uv run pytest -q
          else
            pip install -q -e ".[dev]" 2>/dev/null || pip install -q pytest jsonschema pydantic
            pytest -q
          fi
