[project]
name = "passaporte-pipeline"
version = "0.1.0"
description = "PDF → reviewed item JSON for Passaporte"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "jsonschema>=4.23",
  "referencing>=0.36",
  "anthropic>=1.8.0",
  "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
